<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c18" />
    <title>PrimeTV — hors connexion</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: radial-gradient(circle at 30% 20%, #1e1b4b 0%, #080c18 55%, #04060f 100%);
        color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 30rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 1.25rem;
        background: rgba(15, 23, 42, 0.75);
        padding: 2.25rem 2rem;
        backdrop-filter: blur(12px);
        box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.8);
      }
      .logo {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 1rem;
        background: linear-gradient(135deg, #4f46e5, #a855f7);
        font-size: 1.5rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.35rem; letter-spacing: -0.01em; }
      p { margin: 0 0 1.5rem; color: #94a3b8; line-height: 1.6; font-size: 0.95rem; }
      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.4rem;
        font-weight: 600;
        font-size: 0.9rem;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #4f46e5, #a855f7);
      }
      button:hover { filter: brightness(1.1); }
      small { display: block; margin-top: 1.5rem; color: #64748b; font-size: 0.75rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo" aria-hidden="true">📺</div>
      <h1>Vous êtes hors connexion</h1>
      <p>
        PrimeTV n'a pas pu joindre le serveur. Les pages déjà visitées restent
        disponibles, mais la lecture et la synchronisation nécessitent une connexion.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
      <small>Le service worker sert cette page uniquement en cas de coupure réseau.</small>
    </div>
  </body>
</html>
