# =============================================================================
# PrimeTV — intégration continue
# -----------------------------------------------------------------------------
# Trois chaînes indépendantes (backend, frontend, mobile) + un job d'intégration
# qui démarre l'API sur SQLite en mémoire et exécute le smoke test HTTP.
# Aucun secret n'est requis : la CI utilise une configuration de test.
# =============================================================================
name: CI

on:
  push:
    branches: ["main", "develop", "arena/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Installer les dépendances
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests
      - name: Tests (pytest)
        working-directory: backend
        env:
          APP_ENV: test
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+pysqlite:///./ci_backend.db
          REDIS_URL: ""
          RATE_LIMIT_ENABLED: "false"
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Vérifier que l'application s'importe
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+pysqlite:///./ci_import.db
        run: python -c "from app.main import app; print(len(app.routes), 'routes')"

  frontend:
    name: Frontend · typage + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Installer les dépendances
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npm run lint
      - name: Tests unitaires
        working-directory: web
        run: npm run test
      - name: Build de production
        working-directory: web
        run: npm run build
      - name: Publier le bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  mobile:
    name: Mobile · analyse + tests Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Dépendances
        working-directory: mobile
        run: flutter pub get
      - name: Analyse statique
        working-directory: mobile
        run: flutter analyze
      - name: Tests
        working-directory: mobile
        run: flutter test
      - name: Build web (vérifie la compilation)
        working-directory: mobile
        run: flutter build web --release --base-href /mobile/

  integration:
    name: API · smoke test de bout en bout
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer l'API
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Démarrer l'API (SQLite + seed de démonstration)
        working-directory: backend
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+pysqlite:///./ci_api.db
          REDIS_URL: ""
          SEED_DEMO_DATA: "true"
          CORS_ORIGINS: "http://localhost:5173"
        run: |
          mkdir -p ../artifacts
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../artifacts/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "API prête après ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
      - name: Smoke test
        env:
          BASE_URL: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@primetv.io
          ADMIN_PASSWORD: "PrimeTV#2026"
        run: ./tests/api/smoke.sh
      - name: Journaux de l'API
        if: failure()
        run: tail -n 200 artifacts/api.log

  compose:
    name: Docker · validation du compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Valider docker-compose.yml
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/' .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret-key-not-for-production/' .env
          docker compose config --quiet
          echo "compose valide"
