# =============================================================================
# PrimeTV — reverse proxy d'entrée (HTTP/2, gzip, cache, sécurité)
#   /            -> SPA React (PWA installable, responsive)
#   /api/        -> API FastAPI
#   /docs        -> Swagger UI
# =============================================================================
worker_processes auto;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64m;   # imports de playlists / XMLTV volumineux

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml application/vnd.apple.mpegurl;

    # ---- Limitation de débit (anti-abus) ----
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    upstream primetv_api {
        server backend:8000;
        keepalive 32;
    }

    upstream primetv_web {
        server web:80;
        keepalive 16;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name _;

        # Certificats auto-signés générés par scripts/gen-self-signed-cert.sh
        ssl_certificate     /etc/nginx/certs/primetv.crt;
        ssl_certificate_key /etc/nginx/certs/primetv.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # ---- Sécurité ----
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- Santé du proxy (indépendante du backend) ----
        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---- Santé de la pile (API) ----
        location = /healthz {
            proxy_pass http://primetv_api/healthz;
            proxy_set_header Host $host;
            access_log off;
        }

        # ---- Authentification : limite plus stricte ----
        location = /api/v1/auth/login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://primetv_api;
            include /etc/nginx/primetv_proxy_params.conf;
        }

        # ---- API ----
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://primetv_api;
            include /etc/nginx/primetv_proxy_params.conf;
        }

        # ---- Documentation OpenAPI ----
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://primetv_api;
            include /etc/nginx/primetv_proxy_params.conf;
        }

        # ---- Service worker & manifeste PWA : revalidation systématique ----
        location ~ ^/(sw\.js|manifest\.webmanifest)$ {
            proxy_pass http://primetv_web;
            include /etc/nginx/primetv_proxy_params.conf;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # ---- SPA React ----
        location / {
            proxy_pass http://primetv_web;
            include /etc/nginx/primetv_proxy_params.conf;
        }
    }
}
